name: Apply staged MUSE audit patch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  apply-patch:
    if: ${{ github.head_ref == 'agent/apply-muse-audit-2026-07-23' && !contains(github.event.pull_request.title, '[patch-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Reconstruct, normalize and verify patch
        shell: bash
        run: |
          set -o pipefail
          cat .github/patches/muse-audit.patch.gz.b64.part* \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/muse-audit-uploaded.patch
          sed '/^$/d' /tmp/muse-audit-uploaded.patch > /tmp/muse-audit.patch
          echo "bf9c79dd19766738778f09b8200259f4feb11daab3f499677ee50e16dc88d867  /tmp/muse-audit.patch" \
            | sha256sum --check --strict
          git apply --check --verbose /tmp/muse-audit.patch

      - name: Apply patch and remove staging files
        shell: bash
        run: |
          git apply /tmp/muse-audit.patch
          rm -f .github/patches/muse-audit.patch.gz.b64.part*
          rm -f .github/workflows/apply-muse-audit-patch.yml
          rmdir .github/patches 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize MUSE audit and branding [patch-applied]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
