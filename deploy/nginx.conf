# MUSE behind an nginx you already run.
#
# Serve the contents of `dist/` and keep two things in mind:
#   1. HTTPS is not optional. Camera and microphone are unavailable in an
#      insecure context, so a phone on http:// cannot jam.
#   2. Unknown paths belong to the app, not to the file system.

server {
	listen 443 ssl;
	http2 on;
	server_name muse.example.com;

	ssl_certificate     /etc/letsencrypt/live/muse.example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/muse.example.com/privkey.pem;

	root /var/www/muse;
	index index.html;

	gzip on;
	gzip_types application/javascript application/json text/css image/svg+xml;

	# Hashed bundles and the SoundFont are safe to cache forever
	location ~ ^/(assets|soundfonts)/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	# The shell must revalidate, or an update never reaches the browser
	location ~ ^/(index\.html|edit\.html|service-worker\.js)?$ {
		add_header Cache-Control "no-cache";
		try_files $uri /index.html;
	}

	location / {
		try_files $uri $uri.html /index.html;
	}
}

server {
	listen 80;
	server_name muse.example.com;
	return 301 https://$host$request_uri;
}
